name: Deploy MedCV to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:pdf
      - name: Use the production workflow as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.request("PUT /repos/{owner}/{repo}/pages", { owner, repo, build_type: "workflow" });
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish production site
        id: deployment
        uses: actions/deploy-pages@v4
