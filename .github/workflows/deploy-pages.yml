name: Deploy MedCV to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:pdf
      - name: Prevent the automatic source build overwriting production
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: site } = await github.rest.repos.getPages({ owner, repo });
            if (site.build_type === "workflow") return;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: context.sha, per_page: 100 });
              const automatic = data.workflow_runs.filter(run => run.name === "pages build and deployment");
              if (automatic.length && automatic.every(run => run.status === "completed")) {
                core.info("Automatic source publishing finished; production will now be published last.");
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("The automatic Pages source build did not finish within 10 minutes.");
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish production site
        id: deployment
        uses: actions/deploy-pages@v4
