name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
    paths:
      [
        "android/**",
        "src/**",
        "public/**",
        "index.html",
        ".github/workflows/build-apk.yml",
        "package.json",
        "package-lock.json",
        "vite.config.ts",
        "scripts/**",
      ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p android/app/src/main/assets/web && cp -R dist/. android/app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p android assembleDebug assembleRelease bundleRelease
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Test offline app on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle -p android connectedMedicoDebugAndroidTest connectedPulseDebugAndroidTest || { adb logcat -d -s chromium MedCV; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Medico-Android
          path: |
            android/app/build/outputs/apk/medico/**/*.apk
            android/app/build/outputs/bundle/medicoRelease/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pulse-Android
          path: |
            android/app/build/outputs/apk/pulse/**/*.apk
            android/app/build/outputs/bundle/pulseRelease/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-instrumentation-reports
          path: android/app/build/reports/androidTests/
