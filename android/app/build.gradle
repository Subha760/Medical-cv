plugins { id 'com.android.application' }

android {
    namespace 'com.medcvmaker.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    flavorDimensions 'audience'
    productFlavors {
        medico {
            dimension 'audience'
            manifestPlaceholders = [appName: 'MedCV Medico']
            buildConfigField 'String', 'APP_ENTRY', '"index.html"'
        }
        pulse {
            dimension 'audience'
            applicationIdSuffix '.pulse'
            manifestPlaceholders = [appName: 'Pulse Admin']
            buildConfigField 'String', 'APP_ENTRY', '"pulse/index.html"'
        }
    }
    defaultConfig {
        applicationId 'com.medcvmaker.app'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '4.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
